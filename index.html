<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龍大冒險 - Dino Adventure</title>
    <meta name="description" content="一個精美的網頁恐龍冒險遊戲，跳過障礙物挑戰高分！">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <h1 id="title">恐龍大冒險</h1>
            <div id="score-board">分數: <span id="score">0</span></div>
            <div id="high-score-board">最高紀錄: <span id="high-score">0</span></div>
            <div id="start-screen">
                <h2>準備好了嗎？</h2>
                <p>按下 <strong>空白鍵</strong> 或 <strong>點擊螢幕</strong> 開始跳躍</p>
                <button id="start-button">開始遊戲</button>
            </div>
            <div id="game-over-screen" class="hidden">
                <h2>遊戲結束</h2>
                <p>你的最終分數是: <span id="final-score">0</span></p>
                <button id="restart-button">再試一次</button>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
